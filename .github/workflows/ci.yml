name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m pytest -q

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: consultorio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start source database
        run: docker compose -f deploy/compose.backup-test.yml up -d source-db restore-db

      - name: Apply and validate PostgreSQL migrations
        run: |
          docker compose -f deploy/compose.backup-test.yml run --rm migrate
          docker compose -f deploy/compose.backup-test.yml run --rm migrate alembic check

      - name: Test backup and full restore
        run: |
          docker compose -f deploy/compose.backup-test.yml run --rm backup
          docker compose -f deploy/compose.backup-test.yml run --rm verify

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f deploy/compose.backup-test.yml logs --no-color

      - name: Remove test containers
        if: always()
        run: docker compose -f deploy/compose.backup-test.yml down -v
