groups:
  - name: consultorio-api
    rules:
      - alert: ConsultorioApiDown
        expr: up{job="consultorio-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API do consultorio indisponivel
          description: O Prometheus nao consegue coletar metricas da API ha mais de 2 minutos.

      - alert: ConsultorioHighErrorRate
        expr: |
          sum(rate(clinica_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(clinica_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Taxa elevada de erros HTTP 5xx
          description: Mais de 5% das requisicoes falharam nos ultimos 10 minutos.

      - alert: ConsultorioDatabaseUnavailable
        expr: clinica_database_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Banco de dados indisponivel para a API
          description: A verificacao de prontidao nao consegue consultar o PostgreSQL ha 2 minutos.

      - alert: ConsultorioHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(clinica_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Latencia p95 elevada
          description: O percentil 95 permanece acima de 2 segundos ha 10 minutos.
