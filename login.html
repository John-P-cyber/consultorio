<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Saúde - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body class="app-shell bg-gray-100 min-h-screen flex items-center justify-center font-sans p-5">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        
        <div class="text-center mb-8">
            <span class="brand-mark mx-auto mb-4" aria-hidden="true">+</span>
            <h1 class="text-3xl font-extrabold text-blue-800">Clínica Saúde</h1>
            <p class="text-gray-500 text-sm mt-2">Introduza as suas credenciais para aceder ao portal</p>
        </div>

        <form id="form-login" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700">E-mail</label>
                <input type="email" id="email" required placeholder="exemplo@clinica.com" 
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Palavra-passe</label>
                <input type="password" id="password" required placeholder="••••••••" 
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md hover:shadow-lg">
                Iniciar Sessão
            </button>
        </form>

        <div class="mt-5 text-center">
            <a href="recuperar-senha.html" class="text-sm font-semibold text-blue-700 hover:text-blue-900 hover:underline">Esqueceu sua senha?</a>
            <div class="mt-2">
                <a href="register.html" class="text-sm font-semibold text-blue-700 hover:text-blue-900 hover:underline">Criar conta</a>
            </div>
        </div>
        <p id="msg-erro" class="text-red-500 text-sm font-semibold mt-4 text-center hidden"></p>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgErro = document.getElementById('msg-erro');

            msgErro.classList.add('hidden');

            // O FastAPI espera receber os dados de login no formato "Form Data" (URL Encoded)
            const dadosFormulario = new URLSearchParams();
            dadosFormulario.append('username', email); // O FastAPI usa o campo 'username' para o e-mail
            dadosFormulario.append('password', password);

            try {
                const resposta = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: dadosFormulario
                });

                if (resposta.ok) {
                    const dados = await resposta.json();

                    // Guarda o Token e a Role no navegador do utilizador
                    localStorage.setItem('token', dados.access_token);
                    localStorage.setItem('role', dados.role);

                    // Redireciona de acordo com o nível de acesso
                    if (dados.role === 'admin') {
                        window.location.href = "index.html";
                    } else if (dados.role === 'paciente') {
                        window.location.href = "paciente.html";
                    } else if (dados.role === 'medico') {
                        window.location.href = "medico.html";
                    }
                } else {
                    const erro = await resposta.json();
                    msgErro.textContent = erro.detail || "E-mail ou palavra-passe incorretos.";
                    msgErro.classList.remove('hidden');
                }
            } catch (error) {
                msgErro.textContent = "Erro ao ligar ao servidor de autenticação.";
                msgErro.classList.remove('hidden');
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
