<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Saúde - Cadastro</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="app-shell bg-gray-100 min-h-screen flex items-center justify-center font-sans p-5">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <span class="brand-mark mx-auto mb-4" aria-hidden="true">+</span>
            <h1 class="text-2xl font-extrabold text-blue-800">Criar Conta</h1>
            <p class="text-gray-500 text-sm mt-2">Registe-se para aceder ao portal</p>
        </div>

        <form id="form-register" class="space-y-4">
            <div>
                <label for="clinica" class="block text-sm font-semibold text-gray-700">Código da clínica</label>
                <input type="text" id="clinica" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="ex.: clinica-centro"
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700">E-mail</label>
                <input type="email" id="email" required placeholder="exemplo@clinica.com" 
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Palavra-passe</label>
                <input type="password" id="password" minlength="8" required placeholder="Mín. 8 caracteres, letras e números"
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Confirmar palavra-passe</label>
                <input type="password" id="confirm_password" required placeholder="Repita a palavra-passe" 
                       class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <input type="hidden" id="role" value="paciente">

            <div class="border-t border-gray-200 pt-4 space-y-3">
                <h2 class="text-sm font-semibold text-gray-700">Dados pessoais</h2>
                <div class="grid grid-cols-1 gap-3">
                    <input type="text" id="nome" placeholder="Nome completo" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="cpf" placeholder="CPF" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="tel" id="telefone" placeholder="Telefone" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="date" id="data_nascimento" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_rua" placeholder="Rua" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_numero" placeholder="Número" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_bairro" placeholder="Bairro" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_cidade" placeholder="Cidade" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_estado" placeholder="Estado" required class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <input type="text" id="endereco_cep" placeholder="CEP" required onblur="buscarCepCadastro(this.value)" class="mt-1 block w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <fieldset class="border-t border-gray-200 pt-4 space-y-3">
                <legend class="text-sm font-semibold text-gray-700 mb-2">Privacidade e condições de uso</legend>
                <label class="flex items-start gap-3 text-sm text-gray-600">
                    <input type="checkbox" id="aceita_termos" required class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600">
                    <span>Li e aceito os <a id="link-termos" href="termos.html" target="_blank" class="font-semibold text-blue-700 hover:underline">Termos de Uso</a>.</span>
                </label>
                <label class="flex items-start gap-3 text-sm text-gray-600">
                    <input type="checkbox" id="ciente_privacidade" required class="mt-1 h-4 w-4 rounded border-gray-300 text-blue-600">
                    <span>Declaro ciência da <a id="link-privacidade" href="privacidade.html" target="_blank" class="font-semibold text-blue-700 hover:underline">Política de Privacidade</a> e do tratamento de dados de saúde.</span>
                </label>
            </fieldset>

            <button type="submit" id="botao-cadastrar" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-3 px-4 rounded-lg transition shadow-md hover:shadow-lg">
                Criar Conta
            </button>
        </form>

        <div class="mt-5 text-center">
            <a href="login.html" class="text-sm font-semibold text-blue-700 hover:text-blue-900 hover:underline">Já tem conta? Iniciar sessão</a>
        </div>

        <p id="msg-erro" class="text-red-500 text-sm font-semibold mt-4 text-center hidden"></p>
        <p id="msg-sucesso" class="text-green-600 text-sm font-semibold mt-4 text-center hidden"></p>
    </div>

        <script>
        const API_URL = window.location.origin;
        let documentosLgpd = null;
        fetch(`${API_URL}/lgpd/documentos`).then(resposta => resposta.json()).then(dados => {
            documentosLgpd = dados;
            document.getElementById('link-termos').href = dados.termos_url;
            document.getElementById('link-privacidade').href = dados.privacidade_url;
            document.getElementById('botao-cadastrar').disabled = false;
        }).catch(() => {
            document.getElementById('msg-erro').textContent = 'Não foi possível carregar os documentos de privacidade.';
            document.getElementById('msg-erro').classList.remove('hidden');
        });
        const clinicaSalva = localStorage.getItem('clinica_slug');
        if (clinicaSalva) document.getElementById('clinica').value = clinicaSalva;

        async function buscarCepCadastro(cep) {
            const cepLimpo = cep.replace(/\D/g, '');
            if (cepLimpo.length !== 8) return;

            try {
                const resposta = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                const dados = await resposta.json();
                if (dados.erro) {
                    return;
                }

                document.getElementById('endereco_rua').value = dados.logradouro || '';
                document.getElementById('endereco_bairro').value = dados.bairro || '';
                document.getElementById('endereco_cidade').value = dados.localidade || '';
                document.getElementById('endereco_estado').value = dados.uf || '';
            } catch (err) {
                console.error('Erro ao buscar CEP', err);
            }
        }

        document.getElementById('form-register').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const clinicaSlug = document.getElementById('clinica').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const role = document.getElementById('role').value;
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const dataNascimento = document.getElementById('data_nascimento').value;
            const enderecoRua = document.getElementById('endereco_rua').value.trim();
            const enderecoNumero = document.getElementById('endereco_numero').value.trim();
            const enderecoBairro = document.getElementById('endereco_bairro').value.trim();
            const enderecoCidade = document.getElementById('endereco_cidade').value.trim();
            const enderecoEstado = document.getElementById('endereco_estado').value.trim();
            const enderecoCep = document.getElementById('endereco_cep').value.trim();
            const msgErro = document.getElementById('msg-erro');
            const msgSucesso = document.getElementById('msg-sucesso');

            msgErro.classList.add('hidden'); msgSucesso.classList.add('hidden');

            if (password.length < 8) {
                msgErro.textContent = 'A palavra-passe deve ter pelo menos 8 caracteres.';
                msgErro.classList.remove('hidden');
                return;
            }
            if (password !== confirm) {
                msgErro.textContent = 'As palavras-passe não coincidem.';
                msgErro.classList.remove('hidden');
                return;
            }

            const payload = {
                clinica_slug: clinicaSlug,
                email,
                password,
                role,
                aceita_termos: document.getElementById('aceita_termos').checked,
                ciente_privacidade: document.getElementById('ciente_privacidade').checked,
                termos_versao: documentosLgpd?.termos_versao,
                privacidade_versao: documentosLgpd?.privacidade_versao,
                nome,
                cpf,
                telefone,
                data_nascimento: dataNascimento || undefined,
                endereco_rua: enderecoRua,
                endereco_numero: enderecoNumero,
                endereco_bairro: enderecoBairro,
                endereco_cidade: enderecoCidade,
                endereco_estado: enderecoEstado,
                endereco_cep: enderecoCep,
            };
            try {
                const resposta = await fetch(`${API_URL}/auth/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (resposta.ok) {
                    localStorage.setItem('clinica_slug', clinicaSlug);
                    msgSucesso.textContent = 'Conta criada com sucesso. A redirecionar para o login...';
                    msgSucesso.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'login.html', 1400);
                } else {
                    const erro = await resposta.json();
                    msgErro.textContent = mensagemErroAPI(erro);
                    msgErro.classList.remove('hidden');
                }
            } catch (err) {
                msgErro.textContent = 'Erro ao contactar o servidor.';
                msgErro.classList.remove('hidden');
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
